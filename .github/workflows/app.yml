name: Uygulama

# Her değişiklikte: kod analizi, testler, ekran görüntüleri, yayın APK'sı, Android emülatöründe
# açılış denemesi ve "latest" GitHub Release'ine APK yükleme.

on:
  push:
    branches: [main]
    paths: ["app/**", "tools/**", ".github/workflows/app.yml"]
  workflow_dispatch:

concurrency:
  group: app-build
  cancel-in-progress: true

permissions:
  contents: write

env:
  FLUTTER_VERSION: "3.47.x"

jobs:
  build:
    name: Analiz, test, APK
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Sürümler
        run: |
          flutter --version
          java -version

      - name: Platform klasörlerini hazırla
        run: |
          if [ ! -f android/app/src/main/AndroidManifest.xml ]; then
            echo "Android/iOS klasörleri yok; flutter create ile oluşturuluyor."
            flutter create --project-name techpulse --org com.techpulse --platforms android,ios .
          fi
          python3 ../tools/patch_platforms.py .

      - run: flutter pub get

      - name: Uygulama ikonları
        run: dart run flutter_launcher_icons

      - name: Kod analizi
        run: flutter analyze --no-fatal-infos

      - name: Testler
        run: flutter test --exclude-tags screenshots --reporter expanded

      - name: Ekran görüntüleri
        if: success() || failure()
        run: flutter test --tags screenshots --update-goldens --reporter expanded

      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: ekran-goruntuleri
          path: app/test/screenshots/goldens
          if-no-files-found: ignore

      - name: Yayın APK'sı
        run: |
          API="https://${GITHUB_REPOSITORY_OWNER,,}.github.io/${GITHUB_REPOSITORY#*/}/v1/"
          echo "Veri adresi: $API"
          flutter build apk --release --build-number=${{ github.run_number }} --dart-define=API_BASE_URL=$API
          cp build/app/outputs/flutter-apk/app-release.apk ../TechPulse.apk
          ls -lh ../TechPulse.apk

      - uses: actions/upload-artifact@v5
        with:
          name: TechPulse-apk
          path: TechPulse.apk

      - name: Ekran görüntülerini ve APK'yı ci-app dalına gönder
        if: always()
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          mkdir -p ../ci-out/screenshots ../ci-out/apk
          cp -R test/screenshots/goldens/. ../ci-out/screenshots/ 2>/dev/null || true
          cp ../TechPulse.apk ../ci-out/apk/ 2>/dev/null || true
          find test -path '*failures*' -name '*.png' -exec cp {} ../ci-out/screenshots/ \; 2>/dev/null || true
          bash ../tools/publish_branch.sh ci-app ../ci-out "Derleme #${{ github.run_number }} çıktıları"

      - name: Oluşan platform klasörlerini depoya ekle
        if: github.ref == 'refs/heads/main'
        continue-on-error: true
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A android ios .metadata pubspec.lock 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "Depoya eklenecek yeni dosya yok."
          else
            git commit -m "chore: Android/iOS klasörleri, ikonlar ve pubspec.lock [skip ci]"
            git pull --rebase --autostash origin main
            git push origin HEAD:main
          fi

  emulator:
    name: Android emülatöründe deneme
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - uses: actions/download-artifact@v5
        with:
          name: TechPulse-apk

      - name: KVM'yi etkinleştir
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: bash tools/emulator_smoke.sh TechPulse.apk emulator-shots

      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: emulator-ekranlari
          path: emulator-shots

      - name: Emülatör ekranlarını ci-emulator dalına gönder
        if: always()
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          bash tools/publish_branch.sh ci-emulator emulator-shots "Emülatör denemesi, derleme ${{ github.run_number }}"

  release:
    name: APK'yı yayımla
    needs: emulator
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - uses: actions/download-artifact@v5
        with:
          name: TechPulse-apk

      - name: "GitHub Release: latest"
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest TechPulse.apk \
            --title "TechPulse (son sürüm)" \
            --notes "Derleme #${{ github.run_number }} · $(date -u '+%Y-%m-%d %H:%M UTC'). Telefona kurmak için TechPulse.apk dosyasını indirin." \
            --latest
